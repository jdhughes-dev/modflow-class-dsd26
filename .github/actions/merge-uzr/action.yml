name: Merge uzr-main
description: Merge the uzr-main branch of mjr-deltares/modflow6 into a modflow6 checkout, resolving known conflicts with the rerere cache in .github/rr-cache.
inputs:
  sha:
    description: 'uzr-main commit to merge'
    required: true
  path:
    description: 'Path of the modflow6 checkout, which needs full history'
    required: false
    default: modflow6
runs:
  using: composite
  steps:
    - name: Merge uzr-main
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        SHA: ${{ inputs.sha }}
      run: |
        rr_cache="$(cd "$GITHUB_ACTION_PATH/../../rr-cache" && pwd)"
        git_dir="$(git rev-parse --git-dir)"
        mkdir -p "$git_dir/rr-cache"
        cp -R "$rr_cache/." "$git_dir/rr-cache/"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # fetch blobs too, so the merge does not request uzr-main objects
        # from the checkout's own remote
        git fetch https://github.com/mjr-deltares/modflow6.git "$SHA"

        # rerere matches conflicts by their text, so merge with LF line
        # endings and restore the checkout's line endings afterwards
        autocrlf=$(git config --get core.autocrlf || true)
        if [[ -n "$autocrlf" ]]; then
          git config core.autocrlf false
          git rm -r -q --cached .
          git reset -q --hard
        fi

        # the merge stops even when rerere resolves every conflict
        if ! git -c rerere.enabled=true -c rerere.autoupdate=true merge --no-edit FETCH_HEAD; then
          unmerged=$(git diff --name-only --diff-filter=U)
          if [[ -n "$unmerged" ]]; then
            echo "::error::uzr-main conflicts with no recorded resolution in:"
            echo "$unmerged"
            exit 1
          fi
          git commit --no-edit
        fi

        if [[ -n "$autocrlf" ]]; then
          git config core.autocrlf "$autocrlf"
          git rm -r -q --cached .
          git reset -q --hard
        fi
        git log -1 --oneline
